<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>币价板</title>
<style>
  :root{--bg:#0b0e14;--card:#151a26;--line:#232b3d;--txt:#e8ecf4;--dim:#8b94a7;--up:#22c55e;--down:#ef4444;--gold:#f0b90b}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px 12px 40px;max-width:560px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  h1{font-size:19px;font-weight:800}
  #meta{font-size:12px;color:var(--dim)}
  #bnbBar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px}
  #bnbBar b{color:var(--gold)}
  .addbox{display:flex;gap:8px;margin-bottom:14px}
  .addbox input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:13px;min-width:0}
  .addbox button{background:var(--gold);color:#111;border:0;border-radius:10px;padding:0 18px;font-size:15px;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .row1{display:flex;justify-content:space-between;align-items:baseline}
  .sym{font-size:16px;font-weight:800}
  .name{font-size:11px;color:var(--dim);margin-left:6px;font-weight:400}
  .chg{font-size:15px;font-weight:700}
  .up{color:var(--up)} .down{color:var(--down)}
  .price{font-size:27px;font-weight:800;margin:5px 0 3px;letter-spacing:.2px}
  .sub{font-size:12px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  .row3{display:flex;gap:8px;margin-top:11px}
  .row3 a,.row3 button{flex:1;text-align:center;text-decoration:none;font-size:13px;padding:8px 0;border-radius:9px;border:1px solid var(--line);color:var(--txt);background:#1b2233}
  .row3 .gmgn{background:var(--gold);color:#111;font-weight:700;border-color:var(--gold)}
  .row3 .del{flex:0 0 64px;color:var(--dim)}
  .nopool{font-size:14px;color:var(--dim);padding:6px 0 2px}
  .hint{font-size:12px;color:var(--dim);text-align:center;margin-top:16px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>币价板</h1>
  <div id="meta">加载中…</div>
</header>
<div id="bnbBar"><span>BNB 现价</span><b id="bnbPrice">—</b></div>
<div class="addbox">
  <input id="addrIn" placeholder="粘贴 BSC 合约地址添加" autocomplete="off">
  <button id="addBtn">添加</button>
</div>
<div id="list"></div>
<div class="hint">每 15 秒自动刷新 · 价格来自 DexScreener 链上池子<br>点 GMGN 看 K 线 · 列表会存在手机本地</div>

<script>
const KEY = 'priceboard-v1';
const DEFAULTS = [
  '0x63dea5acdbe1f27c968907d08610a5f0a0284ba6', // AGC
  '0x81c3ab2c7ee773af2ac823b8cef3c430ef11f039', // StarsAI 星星
  '0xb953c5b96c535053c2f925b2fbd0f7063fa028de', // VenusAI
  '0xd83f127e0a659bb621190a1c58db68a089d82fc4', // STAR
  '0x69926a795dfc6e717e9d3e14627803c14c2a600f', // DOGEZILLA 未开盘
  '0x96F27bC154B717D116C29dA70705C395700A044b'  // LIANGXIN 未开盘
];
const WBNB = '0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c';
let watch = load();

function load(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(v) && v.length) return v.map(s=>s.toLowerCase()); }catch(e){}
  return DEFAULTS.map(s=>s.toLowerCase());
}
function save(){ localStorage.setItem(KEY, JSON.stringify(watch)); }

function fmtPrice(p){
  if(p == null || isNaN(p)) return '—';
  if(p >= 1) return '$' + p.toLocaleString('en-US',{maximumFractionDigits:2});
  if(p >= 0.01) return '$' + p.toFixed(4);
  const s = p.toFixed(20).replace(/0+$/,'');
  const m = s.match(/^0\.0*/); const zeros = m ? m[0].length - 2 : 0;
  if(zeros >= 2){
    const digits = s.slice(2 + zeros, 2 + zeros + 4);
    const sub = String(zeros).split('').map(d=>'₀₁₂₃₄₅₆₇₈₉'[+d]).join('');
    return '$0.0' + sub + digits;
  }
  return '$' + s.slice(0, 8);
}
function fmtUsd(v){
  if(v == null || isNaN(v)) return '—';
  if(v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
  if(v >= 1e3) return '$' + (v/1e3).toFixed(1) + 'K';
  return '$' + v.toFixed(0);
}
function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderOne(addr, pair){
  if(!pair){
    return `<div class="card">
      <div class="row1"><span><span class="sym">${addr.slice(0,6)}…${addr.slice(-4)}</span></span>
      <button class="del-x" data-del="${addr}" style="background:none;border:0;color:var(--dim);font-size:13px">删除</button></div>
      <div class="nopool">还没开盘 / 没有池子</div>
      <div class="row3"><a class="gmgn" target="_blank" href="https://gmgn.ai/bsc/token/${addr}">GMGN</a>
      <a target="_blank" href="https://dexscreener.com/bsc/token/${addr}">Dex</a></div></div>`;
  }
  const bt = pair.baseToken || {};
  const chg = (pair.priceChange||{}).h24;
  const cls = chg == null ? '' : (chg >= 0 ? 'up' : 'down');
  const chgTxt = chg == null ? '—' : (chg >= 0 ? '+' : '') + Number(chg).toFixed(2) + '%';
  const price = parseFloat(pair.priceUsd);
  return `<div class="card">
    <div class="row1"><span><span class="sym">${esc(bt.symbol||'?')}</span><span class="name">${esc(bt.name||'')}</span></span>
    <span class="chg ${cls}">${chgTxt}</span></div>
    <div class="price">${fmtPrice(price)}</div>
    <div class="sub"><span>池子 ${fmtUsd((pair.liquidity||{}).usd)}</span><span>24h量 ${fmtUsd((pair.volume||{}).h24)}</span><span>市值 ${fmtUsd(pair.fdv)}</span></div>
    <div class="row3"><a class="gmgn" target="_blank" href="https://gmgn.ai/bsc/token/${addr}">GMGN</a>
    <a target="_blank" href="https://dexscreener.com/bsc/${pair.pairAddress}">Dex</a>
    <button class="del" data-del="${addr}">删除</button></div></div>`;
}

async function refresh(){
  const meta = document.getElementById('meta');
  try{
    const all = [...new Set([...watch, WBNB])];
    const chunks = [];
    for(let i=0;i<all.length;i+=30) chunks.push(all.slice(i,i+30));
    const byAddr = {};
    for(const c of chunks){
      const r = await fetch('https://api.dexscreener.com/latest/dex/tokens/' + c.join(','));
      const j = await r.json();
      for(const p of (j.pairs||[])){
        if(p.chainId !== 'bsc') continue;
        const a = (p.baseToken||{}).address; if(!a) continue;
        const k = a.toLowerCase();
        if(!byAddr[k] || ((p.liquidity||{}).usd||0) > ((byAddr[k].liquidity||{}).usd||0)) byAddr[k] = p;
      }
    }
    const bnb = byAddr[WBNB.toLowerCase()];
    document.getElementById('bnbPrice').textContent = bnb ? fmtPrice(parseFloat(bnb.priceUsd)) : '—';
    document.getElementById('list').innerHTML = watch.map(a => renderOne(a, byAddr[a])).join('');
    meta.textContent = '更新 ' + new Date().toLocaleTimeString('zh-CN',{hour12:false});
  }catch(e){
    meta.textContent = '刷新失败，稍后重试';
  }
}

document.getElementById('addBtn').onclick = () => {
  const inp = document.getElementById('addrIn');
  const v = inp.value.trim().toLowerCase();
  if(!/^0x[0-9a-f]{40}$/.test(v)){ alert('地址不对，要 0x 开头的 42 位 BSC 合约地址'); return; }
  if(!watch.includes(v)) watch.unshift(v);
  save(); inp.value=''; refresh();
};
document.getElementById('addrIn').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('addBtn').click(); });
document.getElementById('list').addEventListener('click', e=>{
  const b = e.target.closest('[data-del]'); if(!b) return;
  watch = watch.filter(a => a !== b.getAttribute('data-del'));
  save(); refresh();
});

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
